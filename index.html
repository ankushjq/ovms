<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=2026-27/circuitlab/">
  <title>OVMS Science Olympiad - Study Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <script>
    window.location.replace("2026-27/circuitlab/");
  </script>
  <style>
    :root {
      --bg: #0b0f19;
      --surface: #131a2c;
      --primary: hsl(195, 100%, 50%);
      --accent: hsl(280, 100%, 65%);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 50%, #111827 0%, #070a12 100%);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .card {
      background: rgba(19, 26, 44, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 3rem 2rem;
      max-width: 540px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }
    .badge {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--primary);
      font-weight: 700;
      background: rgba(0, 210, 255, 0.1);
      padding: 0.4rem 1rem;
      border-radius: 999px;
      border: 1px solid rgba(0, 210, 255, 0.2);
    }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: var(--text-muted);
      line-height: 1.6;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: linear-gradient(135deg, var(--primary), hsl(210, 100%, 55%));
      color: #0b0f19;
      font-weight: 700;
      padding: 0.9rem 1.8rem;
      border-radius: 12px;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 210, 255, 0.4);
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">Science Olympiad Division B</span>
    <h1>OVMS Study Portal</h1>
    <p>Redirecting you to the 2026–2027 Circuit Lab curriculum portal...</p>
    <a href="2026-27/circuitlab/" class="btn">Enter 2026–27 Circuit Lab ⚡</a>
  </div>
</body>
</html>
